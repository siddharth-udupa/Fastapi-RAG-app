<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG App</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #1f2937;
      background: #f9fafb;
    }
    main { max-width: 820px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 4px; }
    h2 { margin-top: 32px; font-size: 1.1rem; }
    .subtitle { color: #6b7280; margin-top: 0; }
    textarea, input[type="file"] { width: 100%; box-sizing: border-box; }
    textarea { padding: 10px; font: inherit; border: 1px solid #d1d5db; border-radius: 6px; }
    button {
      margin-top: 8px; padding: 8px 16px; font: inherit; cursor: pointer;
      border: none; border-radius: 6px; background: #2563eb; color: white;
    }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    pre, .box {
      white-space: pre-wrap; word-wrap: break-word;
      border: 1px solid #e5e7eb; border-radius: 6px;
      padding: 12px; background: white; min-height: 24px;
    }
    #answerOutput { min-height: 100px; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .muted { color: #6b7280; }
    .error { color: #b91c1c; }
    details { background: white; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; }
    summary { cursor: pointer; }
    details pre { border: none; padding: 8px 0 0; margin: 0; }
  </style>
</head>
<body>
<main>
  <h1>RAG App</h1>
  <p class="subtitle">Upload a PDF, ask a question, get an answer backed by your documents.</p>

  <!-- 1. Upload -->
  <h2>1. Upload a document</h2>
  <input type="file" id="fileInput" accept=".pdf">
  <button id="uploadButton" onclick="uploadDocument()">Upload</button>
  <pre id="uploadResult" class="muted">No file uploaded yet.</pre>

  <!-- 2. Ask -->
  <h2>2. Ask a question</h2>
  <textarea id="questionInput" rows="3" placeholder="e.g. What are the main conclusions of this document?"></textarea>
  <div class="row">
    <button id="askButton" onclick="askQuestion()">Ask</button>
    <label>
      <input type="checkbox" id="streamToggle" checked>
      Stream the answer
    </label>
  </div>

  <!-- 3. Answer -->
  <h2>3. Answer</h2>
  <div id="answerOutput" class="box"></div>
  <div id="statusLine" class="muted"></div>

  <!-- 4. Sources -->
  <h2>4. Sources</h2>
  <div id="sourcesOutput" class="muted">Sources will appear here.</div>
</main>

<script>
  // All backend routes live under /api/v1 (see app/api/router.py).
  const API = '/api/v1';

  const answerEl = document.getElementById('answerOutput');
  const sourcesEl = document.getElementById('sourcesOutput');
  const statusEl = document.getElementById('statusLine');
  const askButton = document.getElementById('askButton');

  // --- Upload --------------------------------------------------------------

  async function uploadDocument() {
    const file = document.getElementById('fileInput').files[0];
    const resultEl = document.getElementById('uploadResult');
    const button = document.getElementById('uploadButton');

    if (!file) {
      resultEl.textContent = 'Select a PDF first.';
      return;
    }

    const formData = new FormData();
    formData.append('file', file);

    button.disabled = true;
    resultEl.textContent = 'Uploading and embedding... (this can take a few seconds)';

    try {
      const res = await fetch(`${API}/documents/upload`, {
        method: 'POST',
        body: formData,
      });
      const data = await res.json();

      if (!res.ok) {
        resultEl.textContent = `Upload failed: ${data.detail || res.statusText}`;
        return;
      }

      resultEl.textContent = JSON.stringify(data, null, 2);
    } catch (error) {
      resultEl.textContent = `Upload failed: ${error.message}`;
    } finally {
      button.disabled = false;
    }
  }

  // --- Ask -----------------------------------------------------------------

  async function askQuestion() {
    const question = document.getElementById('questionInput').value.trim();
    if (!question) {
      alert('Enter a question first.');
      return;
    }

    resetOutput();

    const useStream = document.getElementById('streamToggle').checked;
    askButton.disabled = true;

    try {
      if (useStream) {
        await askStreaming(question);
      } else {
        await askOnce(question);
      }
    } catch (error) {
      showError(error.message);
    } finally {
      askButton.disabled = false;
      statusEl.textContent = '';
    }
  }

  async function askOnce(question) {
    statusEl.textContent = 'Retrieving documents and generating an answer...';

    const res = await fetch(`${API}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.detail || `Request failed (${res.status})`);
      return;
    }

    answerEl.textContent = data.answer;
    renderSources(data.sources, data.used_context);
  }

  async function askStreaming(question) {
    statusEl.textContent = 'Retrieving documents...';

    const res = await fetch(`${API}/query/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showError(data.detail || `Request failed (${res.status})`);
      return;
    }

    statusEl.textContent = 'Generating...';

    // Read the response body as a stream of bytes. Each chunk may contain
    // part of an SSE event, or several complete events, so we buffer text
    // and only process it when we see the blank line that ends an event.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      let boundary;
      while ((boundary = buffer.indexOf('\n\n')) !== -1) {
        const rawEvent = buffer.slice(0, boundary);
        buffer = buffer.slice(boundary + 2);
        handleSseEvent(rawEvent);
      }
    }
  }

  function handleSseEvent(rawEvent) {
    let eventName = 'message';
    const dataLines = [];

    for (const line of rawEvent.split('\n')) {
      if (line.startsWith('event:')) {
        eventName = line.slice('event:'.length).trim();
      } else if (line.startsWith('data:')) {
        dataLines.push(line.slice('data:'.length).trim());
      }
    }

    const data = dataLines.length ? JSON.parse(dataLines.join('\n')) : {};

    if (eventName === 'sources') {
      renderSources(data.sources, data.used_context);
    } else if (eventName === 'token') {
      answerEl.textContent += data.text;
    } else if (eventName === 'error') {
      showError(data.message);
    }
  }

  // --- Rendering helpers ---------------------------------------------------

  function resetOutput() {
    answerEl.textContent = '';
    answerEl.classList.remove('error');
    sourcesEl.className = 'muted';
    sourcesEl.textContent = 'Sources will appear here.';
    statusEl.textContent = '';
  }

  function showError(message) {
    answerEl.textContent = `Error: ${message}`;
    answerEl.classList.add('error');
  }

  function renderSources(sources, usedContext) {
    if (!usedContext || sources.length === 0) {
      sourcesEl.className = 'muted';
      sourcesEl.textContent =
        'No matching chunks were found. The answer came from the model\'s general knowledge.';
      return;
    }

    sourcesEl.className = '';
    sourcesEl.innerHTML = sources
      .map(
        (source, index) => `
          <details>
            <summary>
              [Source ${index + 1}] ${escapeHtml(source.filename)}
              &middot; chunk ${source.chunk_index}
              &middot; similarity ${source.similarity.toFixed(3)}
            </summary>
            <pre>${escapeHtml(source.content)}</pre>
          </details>`
      )
      .join('');
  }

  function escapeHtml(text) {
    return text
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }
</script>
</body>
</html>
